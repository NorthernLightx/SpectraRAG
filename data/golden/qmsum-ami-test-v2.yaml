  category: factual
  relevant_chunk_ids: []
  relevant_pages: []
  relevant_spans:
  - start_s: 201.1
    end_s: 357.17
  expected_facts:
  - Market research was done with a hundred subjects and Marketing concluded the most important aspect
    required in the device is a fancy look and feel. The second and third important aspects are technologically
    innovative and being easy to use. Fruits and vegetables can be taken into consideration when thinking
