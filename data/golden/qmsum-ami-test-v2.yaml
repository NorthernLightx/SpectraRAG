- query_id: qmsum_ES2004d_s0
  text: What did the group discuss about simulation market evaluation of the new remote control?
  paper_id: ES2004d
  category: factual
  relevant_chunk_ids: []
  relevant_pages: []
  relevant_spans:
  - start_s: 456.0
    end_s: 1054.64
  expected_facts:
  - Marketing summarized the user requirements according to the market reports. Users expected a fancy
    look, technological innovation, and minimization of repetitive strain injury. The team did a preliminary
    rating using a seven-point scale. The results were that the remote control's fashion style and location
    function were most highly rated, but the team was not satisfied enough with the minimization of repetitive
    strain injury. The team agreed on further modifications to the current prototype.
  note: QMSum | split=test | turns=196 | seconds=599
- query_id: qmsum_ES2004d_s1
  text: What did Marketing think of the incorporation of current fashion trends in the prototype when
    making a simulation market evaluation of the new remote control?
  paper_id: ES2004d
  category: factual
  relevant_chunk_ids: []
  relevant_pages: []
  relevant_spans:
  - start_s: 782.78
    end_s: 836.83
  expected_facts:
  - Marketing initially doubted that Industrial Designer was limited in the use of materials for the prototype,
    which would harm the fashion style. Marketing was soon convinced by Industrial Designer, however,
    that the changeable faces would allow users to customize their remote controls. Besides, the rubber
    case would give a spongy feel. Marketing thus rated one point for Industrial Designer's style design.
  note: QMSum | split=test | turns=21 | seconds=54
- query_id: qmsum_ES2004d_s2
  text: What's the conclusion of the minimization of repetitive strain injury when making simulation market
    evaluation of the new remote control?
  paper_id: ES2004d
  category: factual
  relevant_chunk_ids: []
  relevant_pages: []
  relevant_spans:
  - start_s: 846.76
    end_s: 922.55
  expected_facts:
  - Marketing considered the design of pointers unfeasible, for many users were prone to zap. Project
    Manager recommended the slight and small-sized buttons with more space in between. Regretfully, the
    team failed to come up with a perfectly feasible solution to the problem. The team thus gave low rate
    points to the prototype's minimization of repetitive strain injury.
  note: QMSum | split=test | turns=31 | seconds=76
- query_id: qmsum_ES2004d_s3
  text: Summarize the discussion about cost calculation and budget issues.
  paper_id: ES2004d
  category: factual
  relevant_chunk_ids: []
  relevant_pages: []
  relevant_spans:
  - start_s: 1117.91
    end_s: 1632.17
  expected_facts:
  - The team calculated the cost of the remote control in the Euro. The team included one regular chip,
    one kinetic cell, one double-curved bottom, one push button, one LCD screen, as well as rubber and
    plastic materials. The team decided to recommend voice recognition to business customers. Once the
    budget increased, voice recognition would be incorporated. Overall, the present cost was 12.5 Euros
    and was under the budget.
  note: QMSum | split=test | turns=200 | seconds=514
