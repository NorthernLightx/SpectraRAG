- query_id: qmsum_ES2004c_s2
  text: What are the actual components found in most remote controls that will be included in this remote
    design?
  paper_id: ES2004c
  category: factual
  relevant_chunk_ids: []
  relevant_pages: []
  relevant_spans:
  - start_s: 452.66
    end_s: 474.86
  - start_s: 874.85
    end_s: 966.91
  expected_facts:
  - Industrial Designer explained that TA11835 is a chip used in pretty much every remote control to send
    out standard signals based on the input. On the other hand, most current remotes use a silicone printed
    circuit board (PCB board) which connects the circuits so that the messages would be sent to the chip.
    The size should be decided as the board can be custom made.
  note: QMSum | split=test | turns=7 | seconds=114
- query_id: qmsum_ES2004c_s3
  text: What are the benefits and drawbacks for each battery option mentioned and what did Industrial
    Manager suggest to conserve battery life when discussing the design and availability of actual components?
  paper_id: ES2004c
  category: factual
  relevant_chunk_ids: []
  relevant_pages: []
  relevant_spans:
  - start_s: 474.86
    end_s: 870.2
  - start_s: 966.89
    end_s: 1005.47
  expected_facts:
  - Standard AA and AAA are bulky but the cheapest. Dynamo and dual charging with normal batteries and
    solar charging take up too much space. Solar charging is the second cheapest but not resistant to
    dropping. Also, Project Manager believed it would limit the market. Kinetic charging is small and
    portable but market research should be done first. No rechargeable battery options were available.
    The remote could have a standby mode and the lights behind the buttons would be switched off after
    five or ten seconds when not in use.
  note: QMSum | split=test | turns=133 | seconds=434
