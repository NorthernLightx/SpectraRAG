    end_s: 863.53
  expected_facts:
  - Marketing believed that most of the market would want convenient channel browsing and volume adjustment
    features instead of any tampering or programming with too many buttons. User Interface agreed with
    the simplification of symbols. The team came up with a menu display to make the remote more user-friendly.
  note: QMSum | split=test | turns=33 | seconds=119
