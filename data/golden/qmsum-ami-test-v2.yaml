queries:
- query_id: qmsum_ES2004a_s0
  text: What did the group discuss about remote control style and design optimization?
  paper_id: ES2004a
  category: factual
  relevant_chunk_ids: []
  relevant_pages: []
  relevant_spans:
  - start_s: 638.1
    end_s: 1038.65
  expected_facts:
  - Industrial Designer desired to integrate remote controls for different appliances into one. Marketing
    pointed out that such integration would lead to too many buttons, which was not user-friendly enough.
    Instead, Marketing suggested that a menu display should be incorporated. Project Manager and User
    Interface agreed and added that basic buttons could remain. User Interface and Industrial Designer
    refused the flip top, however, for it costs a lot. The team temporarily chose lightweight plastic
    to be the material.
  note: QMSum | split=test | turns=139 | seconds=401
