  category: factual
  relevant_chunk_ids: []
  relevant_pages: []
  relevant_spans:
  - start_s: 280.55
    end_s: 347.54
  expected_facts:
  - Industrial Designer admitted that current remote controls were mostly powered by triple A batteries.
    However, Industrial Designer also pointed out that they were bulky, although they had been the smallest
    fit-in batteries at present. Industrial Designer expressed a desire to find a smaller alternative
    for triple A batteries.
  note: QMSum | split=test | turns=17 | seconds=67
- query_id: qmsum_ES2004b_s2
  text: Summarize the discussion about market research and adjustments due to new project requirements.
  paper_id: ES2004b
  category: factual
  relevant_chunk_ids: []
  relevant_pages: []
  relevant_spans:
  - start_s: 845.63
    end_s: 2167.49
  expected_facts:
  - The market research presented by Marketing implicated that the remote control design was expected
    to be more stylish and less complicated. Project Manager added that an ideal model would be for TV
    only and have a corporate logo incorporated. To meet the requirements above, Industrial Designer recommended
    a touch screen panel. Marketing suggested that the remote control size could be adjusted due to physical
    differences among international users. The team gave up speech recognition, for it would cost a lot.
    An alarm would be incorporated for detection in case the remote control was lost in the house.
  note: QMSum | split=test | turns=362 | seconds=1322
- query_id: qmsum_ES2004b_s3
  text: Why did Industrial Designer think of incorporating an alarm when discussing market research and
    adjustments due to new project requirements?
  paper_id: ES2004b
  category: factual
  relevant_chunk_ids: []
  relevant_pages: []
  relevant_spans:
  - start_s: 922.15
    end_s: 1030.29
  - start_s: 1188.63
    end_s: 1237.95
  expected_facts:
  - The market research implicated that users' biggest frustration was their failure in finding the remote
    control once it was lost in the house. To solve the problem, Industrial Designer suggested that a
    button could be added on the TV; when the user pressed the button, the remote control would beep to
    let the user know its location. Meanwhile, such a solution would be within budget.
  note: QMSum | split=test | turns=19 | seconds=157
