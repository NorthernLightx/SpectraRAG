  relevant_chunk_ids: []
  relevant_pages: []
  relevant_spans:
  - start_s: 112.69
    end_s: 188.62
  expected_facts:
  - Teletext will not be used and there will not be a control for everything. The buttons should be easy
    to find. The image of the company is to be incorporated in the design and a flip design is decided.
    Voice recognition is left out. The shape of the remote will be different than normal, like a shell
