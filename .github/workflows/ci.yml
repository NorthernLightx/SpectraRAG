name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3
        with:
          version: "0.5.4"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy strict
        run: uv run mypy src tests scripts

      - name: Pytest (unit)
        run: uv run pytest -v --cov=src --cov-report=term-missing

      - name: Cache bge-m3 and reranker weights
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-minilm-l6

      - name: Eval regression gate (served cpu profile, text and hybrid arms)
        # The served `cpu` stack (bge-m3 on CPU, BM25, RRF, MiniLM rerank) runs
        # live over the committed rag_corpus snapshot; the visual leg replays
        # from data/eval/fixtures/visual-legs-v3.json. Both arms are gated on
        # page-level means and per query. See docs/evals.md "Regression gate".
        run: |
          uv run python -m scripts.eval_retrieval_ci \
            --output data/eval/runs/retrieval-ci.json \
            --hybrid-output data/eval/runs/retrieval-ci-hybrid.json
          uv run python -m scripts.check_regression \
            --baseline data/eval/baseline_retrieval.json \
            --candidate data/eval/runs/retrieval-ci.json \
            --metrics ndcg_at_5 recall_at_10 mrr \
            --threshold 0.05 --per-query recall_at_10
          uv run python -m scripts.check_regression \
            --baseline data/eval/baseline_retrieval_hybrid.json \
            --candidate data/eval/runs/retrieval-ci-hybrid.json \
            --metrics ndcg_at_5 recall_at_10 mrr \
            --threshold 0.05 --per-query recall_at_10
