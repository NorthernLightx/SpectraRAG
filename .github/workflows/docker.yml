# Two jobs:
# - validate: builds the Dockerfile on PRs only. Fast, no GHCR push. On push to
#   main, publish builds the same image, so a separate validate build would just
#   duplicate it (and double the disk pressure on the runner).
# - publish: runs on main + version-tag pushes, weekly and on manual
#   dispatch. The bake artefacts
#   (`data/pages/`, `qdrant_local/`) are committed to git, so this job is
#   just `docker build` + `docker push`. ~10-15 min cold cache, ~3 min warm.
#
# Why the artefacts are committed: the CPU bge-m3 embed loop on a free
# GH runner takes ~100 min for the curated 20-paper corpus, blowing past
# any reasonable timeout. ~110 MB of binary artefacts in git history
# trades repo size for deploy reliability.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "src/**"
      - "data/pages/**"
      - "qdrant_local/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker.yml"
  schedule:
    # Mondays, ahead of the image scan in security.yml: without a push, only
    # a rebuild brings patched Debian packages into the :main image.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6  # v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          # ignore-error: a cancelled prior run (cancel-in-progress) can
          # orphan cache entries, and the multi-GB bge-m3 + uv layers can
          # exceed the 10GB GHA cache quota mid-export. Don't gate a
          # successful build on best-effort cache writes.
          cache-to: type=gha,ignore-error=true

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6  # v2.0.0
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A cached apt layer would keep last month's packages, so the
          # weekly run builds every layer again.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,ignore-error=true
